<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="20" y="40" width="110" height="110" fill="#fff" stroke="#333" stroke-width="2"/>
<ellipse cx="75" cy="95" rx="38" ry="44" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
<path d="M75,52 C62,75 88,108 75,138" fill="none" stroke="#777" stroke-width="2"/>
<text x="75" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">x: the image</text>
<text x="75" y="196" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">you want</text>
<line x1="135" y1="95" x2="190" y2="95" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="195" y="55" width="190" height="80" rx="8" fill="#e9eef2" stroke="#333" stroke-width="2.5"/>
<text x="290" y="85" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">forward model A</text>
<text x="290" y="107" text-anchor="middle" font-size="14" fill="#333">known physics, plus noise</text>
<text x="290" y="125" text-anchor="middle" font-size="13" fill="#555">(MRI keeps some frequencies)</text>
<line x1="390" y1="95" x2="445" y2="95" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="450" y="40" width="110" height="110" fill="#fff" stroke="#333" stroke-width="2"/>
<line x1="462" y1="46" x2="462" y2="144" stroke="#555" stroke-width="2"/>
<line x1="473" y1="46" x2="473" y2="144" stroke="#555" stroke-width="2"/>
<line x1="484" y1="46" x2="484" y2="144" stroke="#555" stroke-width="2"/>
<line x1="495" y1="46" x2="495" y2="144" stroke="#555" stroke-width="2"/>
<line x1="506" y1="46" x2="506" y2="144" stroke="#555" stroke-width="2"/>
<line x1="517" y1="46" x2="517" y2="144" stroke="#555" stroke-width="2"/>
<line x1="528" y1="46" x2="528" y2="144" stroke="#555" stroke-width="2"/>
<line x1="539" y1="46" x2="539" y2="144" stroke="#555" stroke-width="2"/>
<line x1="550" y1="46" x2="550" y2="144" stroke="#555" stroke-width="2"/>
<text x="505" y="176" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">y: what the</text>
<text x="505" y="196" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">instrument records</text>
<line x1="450" y1="230" x2="130" y2="230" stroke="#B31B1B" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="290" y="222" text-anchor="middle" font-size="26" fill="#B31B1B" font-weight="bold">?</text>
<text x="290" y="262" text-anchor="middle" font-size="15" fill="#B31B1B" font-weight="bold">many x fit one y, so you need a rule for which x to prefer</text>
<rect x="605" y="30" width="275" height="125" rx="8" fill="#fff" stroke="#B31B1B" stroke-width="3"/>
<text x="742" y="56" text-anchor="middle" font-size="16" fill="#B31B1B" font-weight="bold">Plug-and-play diffusion prior</text>
<text x="742" y="80" text-anchor="middle" font-size="14" fill="#333">an image generator trained on</text>
<text x="742" y="98" text-anchor="middle" font-size="14" fill="#333">images from the field is the rule;</text>
<text x="742" y="116" text-anchor="middle" font-size="14" fill="#333">reuse it with any forward model A,</text>
<text x="742" y="134" text-anchor="middle" font-size="14" fill="#333">no retraining</text>
<rect x="605" y="170" width="275" height="105" rx="8" fill="#fff" stroke="#777" stroke-width="2.5"/>
<text x="742" y="196" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">End-to-end network</text>
<text x="742" y="220" text-anchor="middle" font-size="14" fill="#333">trained to map y straight to x</text>
<text x="742" y="238" text-anchor="middle" font-size="14" fill="#333">for one specific A;</text>
<text x="742" y="256" text-anchor="middle" font-size="14" fill="#333">retrain if A changes</text>
<text x="450" y="322" text-anchor="middle" font-size="12" fill="#777">diagram drawn for this course; MRI example, shapes invented</text>
</svg>