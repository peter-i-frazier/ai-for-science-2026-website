<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B31B1B"/></marker>
  </defs>
  <!-- image -->
  <rect x="20" y="110" width="100" height="100" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <g fill="#9a9a9a"><ellipse cx="55" cy="140" rx="15" ry="12"/><ellipse cx="95" cy="133" rx="12" ry="15"/><ellipse cx="72" cy="183" rx="16" ry="12"/></g>
  <text x="70" y="234" text-anchor="middle" font-size="16" fill="#333">one image</text>
  <!-- teacher path -->
  <line x1="125" y1="130" x2="205" y2="70" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="112" y="60" font-size="15" fill="#333">large crops</text>
  <rect x="210" y="40" width="200" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="310" y="71" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Teacher</text>
  <text x="310" y="94" text-anchor="middle" font-size="15" fill="#333">sees only large crops</text>
  <!-- student path -->
  <line x1="125" y1="190" x2="205" y2="250" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="112" y="286" font-size="15" fill="#333">large and small crops</text>
  <rect x="210" y="210" width="200" height="70" rx="8" fill="#fff" stroke="#B31B1B" stroke-width="3"/>
  <text x="310" y="241" text-anchor="middle" font-size="20" font-weight="bold" fill="#B31B1B">Student</text>
  <text x="310" y="264" text-anchor="middle" font-size="15" fill="#333">updated by training</text>
  <!-- EMA arrow: student -> teacher -->
  <line x1="310" y1="205" x2="310" y2="116" stroke="#777" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="322" y="152" font-size="14" fill="#555">teacher weights = moving</text>
  <text x="322" y="170" font-size="14" fill="#555">average of student weights</text>
  <!-- outputs -->
  <line x1="415" y1="75" x2="520" y2="75" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
  <rect x="525" y="48" width="170" height="54" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="610" y="72" text-anchor="middle" font-size="16" fill="#333">teacher's output</text>
  <text x="610" y="91" text-anchor="middle" font-size="13" fill="#777">centered + sharpened</text>
  <line x1="415" y1="245" x2="520" y2="245" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
  <rect x="525" y="218" width="170" height="54" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="610" y="251" text-anchor="middle" font-size="16" fill="#333">student's output</text>
  <!-- match -->
  <line x1="610" y1="212" x2="610" y2="108" stroke="#B31B1B" stroke-width="3.5" marker-end="url(#g)"/>
  <text x="628" y="156" font-size="17" fill="#B31B1B" font-weight="bold">make the student</text>
  <text x="628" y="177" font-size="17" fill="#B31B1B" font-weight="bold">match the teacher</text>
  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#777">diagram drawn for this course; recipe from Caron et al., DINO, arXiv:2104.14294</text>
</svg>
