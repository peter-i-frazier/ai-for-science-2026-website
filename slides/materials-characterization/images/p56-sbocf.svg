<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B31B1B"/></marker></defs>
<text x="450" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">Match a simulated diffraction pattern to the measured one by adjusting a few dials</text>
<rect x="20" y="55" width="190" height="90" rx="6" fill="#fff" stroke="#B31B1B" stroke-width="2"/>
<text x="115.0" y="86.25" text-anchor="middle" font-size="15" fill="#B31B1B" font-weight="bold">Specimen parameters</text>
<text x="115.0" y="105.25" text-anchor="middle" font-size="15" fill="#B31B1B" font-weight="bold">thickness, mistilt</text>
<text x="115.0" y="124.25" text-anchor="middle" font-size="15" fill="#B31B1B" font-weight="bold">(unknown)</text>
<line x1="210" y1="100" x2="270" y2="100" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="270" y="55" width="170" height="90" rx="6" fill="#e9eef2" stroke="#333" stroke-width="2"/>
<text x="355.0" y="86.25" text-anchor="middle" font-size="15" fill="#333">Simulator</text>
<text x="355.0" y="105.25" text-anchor="middle" font-size="15" fill="#333">(slow: 50 runs</text>
<text x="355.0" y="124.25" text-anchor="middle" font-size="15" fill="#333">in total)</text>
<line x1="440" y1="100" x2="500" y2="100" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="500" y="55" width="170" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="585.0" y="95.75" text-anchor="middle" font-size="15" fill="#333">Simulated</text>
<text x="585.0" y="114.75" text-anchor="middle" font-size="15" fill="#333">PACBED pattern</text>
<line x1="670" y1="100" x2="720" y2="100" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="720" y="55" width="160" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="800.0" y="86.25" text-anchor="middle" font-size="15" fill="#333">Compare with</text>
<text x="800.0" y="105.25" text-anchor="middle" font-size="15" fill="#333">measured pattern:</text>
<text x="800.0" y="124.25" text-anchor="middle" font-size="15" fill="#333">squared error</text>
<line x1="800" y1="145" x2="800" y2="200" stroke="#555" stroke-width="2.4"/>
<line x1="800" y1="200" x2="115" y2="200" stroke="#555" stroke-width="2.4"/>
<line x1="115" y1="200" x2="115" y2="147" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="300" y="175" width="300" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="450.0" y="205.25" text-anchor="middle" font-size="15" fill="#333">Bayesian optimization picks the next dials</text>
<text x="20" y="275" text-anchor="start" font-size="16" fill="#333">The error adds up over 24,649 pixels. SBOCF models 11 patch-level summaries instead,</text>
<text x="20" y="303" text-anchor="start" font-size="16" fill="#333">and keeps the original pixel-by-pixel error.</text>
<text x="20" y="345" text-anchor="start" font-size="16" fill="#B31B1B" font-weight="bold">No network is trained beforehand. With 50 simulator runs it cut the median error</text>
<text x="20" y="373" text-anchor="start" font-size="16" fill="#B31B1B" font-weight="bold">by up to 290x against standard Bayesian optimization (synthetic thick specimen).</text>
<text x="450.0" y="432" text-anchor="middle" font-size="12" fill="#777">diagram drawn for this course; numbers from Yoon et al., arXiv:2609.02126</text>
</svg>