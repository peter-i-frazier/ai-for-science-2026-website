<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- image input -->
  <rect x="20" y="50" width="120" height="100" rx="6" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <g fill="#9a9a9a"><ellipse cx="55" cy="85" rx="18" ry="14"/><ellipse cx="105" cy="75" rx="14" ry="18"/><ellipse cx="80" cy="125" rx="20" ry="14"/></g>
  <text x="80" y="176" text-anchor="middle" font-size="15" fill="#333">micrograph</text>
  <line x1="145" y1="100" x2="190" y2="100" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- vision encoder -->
  <rect x="195" y="55" width="150" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="270" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Image encoder</text>
  <text x="270" y="114" text-anchor="middle" font-size="13" fill="#333">a vision transformer,</text>
  <text x="270" y="131" text-anchor="middle" font-size="13" fill="#333">often CLIP's</text>
  <line x1="350" y1="100" x2="395" y2="100" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- projector -->
  <rect x="400" y="55" width="130" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="465" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Projector</text>
  <text x="465" y="114" text-anchor="middle" font-size="13" fill="#333">maps image tokens</text>
  <text x="465" y="131" text-anchor="middle" font-size="13" fill="#333">into word space</text>
  <line x1="535" y1="100" x2="580" y2="100" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- LLM -->
  <rect x="585" y="40" width="170" height="190" rx="8" fill="#B31B1B"/>
  <text x="670" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Language model</text>
  <text x="670" y="130" text-anchor="middle" font-size="14" fill="#fff">reads image tokens</text>
  <text x="670" y="150" text-anchor="middle" font-size="14" fill="#fff">and text tokens</text>
  <text x="670" y="170" text-anchor="middle" font-size="14" fill="#fff">as one sequence</text>
  <!-- text prompt -->
  <rect x="400" y="190" width="130" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="465" y="216" text-anchor="middle" font-size="14" fill="#333">"What phase is</text>
  <text x="465" y="234" text-anchor="middle" font-size="14" fill="#333">the bright region?"</text>
  <line x1="535" y1="220" x2="580" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- answer -->
  <line x1="760" y1="135" x2="805" y2="135" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="810" y="100" width="75" height="70" rx="6" fill="#fff" stroke="#B31B1B" stroke-width="3"/>
  <text x="847" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">text</text>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#777">diagram drawn for this course; layout follows LLaVA (Liu et al., NeurIPS 2023)</text>
</svg>
