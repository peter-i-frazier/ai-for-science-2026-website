<h1 id="reading-3-due-fri-oct-9-no-class-fri-oct-9">Reading 3 due Fri Oct 9; no class Fri Oct 9</h1>
<p><strong>Reading 3, due Fri Oct 9: what protein language models learn.</strong> Free extension for everyone until Mon Oct 12.</p>
<p><strong>Zhang, Wayment-Steele, Brixi, Wang, Kern, Ovchinnikov.</strong> <em>Protein language models learn evolutionary statistics of interacting sequence motifs.</em> PNAS, 2024. doi:10.1073/pnas.2406285121</p>
<p>Explains why contacts fall out of ESM-2's attention maps: the model stores coevolution statistics of interacting motif pairs.</p>
<p><strong>Li, Amini, Yue, Yang, Lu.</strong> <em>Feature reuse and scaling: understanding transfer learning with protein language models.</em> ICML 2024 (PMLR 235).</p>
<p>Explains why ridge regression on one-hot encodings holds its own: most of the transfer gain comes from low-level features learned early in pretraining, and for most tasks does not grow with scale.</p>

, repeat. This session covers four ways to make that model more effective:</p>
<ol>
<li><strong>Prompt engineering</strong> — choose the text it continues from</li>
<li><strong>Reasoning</strong> — the model writes scratch work to itself before it answers</li>
<li><strong>Tools</strong> — part of its output is wired to code you control</li>
<li><strong>Agents</strong> — tool calls repeated in a loop, toward a goal</li>
</ol>

<h1 id="prompt-engineering-can-improve-output-quality">Prompt engineering can improve output quality</h1>
<p>The model continues whatever text it is given, so the prompt shapes the answer.</p>
<p>Ways to get a better answer:</p>
<ul>
<li><strong>State the task and the output format</strong> — units, fields, and what to return when the answer is unknown.</li>
<li><strong>Paste in relevant context</strong> — the protocol, the data table, the paper. The model uses what is in its window and what it absorbed in training.</li>
<li><strong>Show worked examples (&quot;few-shot&quot;)</strong> — GPT-3 performed new tasks from a few examples in the prompt, with no retraining. In later prompt searches, choosing the examples mattered more than wording the instruction.</li>
<li><strong>Ask for the steps</strong> — appending <em>&quot;Let's think step by step&quot;</em> raised InstructGPT on grade-school math (GSM8K) from 10.4% to 40.7% correct.</li>
</ul>
<p><span class="cite">Brown et al. <em>Language Models are Few-Shot Learners</em>. NeurIPS 2020. arXiv:2005.14165 · Kojima, Gu, Reid, Matsuo, Iwasawa. <em>Large Language Models are Zero-Shot Reasoners</em>. NeurIPS 2022. arXiv:2205.11916 · Opsahl-Ong et al. EMNLP 2024. arXiv:2406.11695</span></p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>

<h1 id="worked-examples-make-the-model-show-its-steps">Worked examples make the model show its steps</h1>
<p><span class="cite">Wei, Wang, Schuurmans, Bosma, Ichter, Xia, Chi, Le, Zhou. <em>Chain-of-Thought Prompting Elicits Reasoning in Large Language Models</em>. NeurIPS 2022. arXiv:2201.11903</span></p>
<p><img src="images/cot-wei2022-fig1.png" alt="center" style="width:760px;" /></p>
<p>The paper's prompts held eight such examples. On GSM8K math word problems, PaLM 540B went from 17.9% to 56.9% correct. Most models under 10B parameters got worse.</p>

<h1 id="prompt-engineering-can-be-automated">Prompt engineering can be automated</h1>
<p><strong>Prompt engineering is black-box optimization.</strong> Propose an input <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.294ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 572 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container> — the prompt: its instruction and which worked examples it shows. Observe a score <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.299ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1900 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g><g data-mml-node="mo" transform="translate(550,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(939,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(1511,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container> — accuracy on a few hundred labeled questions (&quot;dev set&quot;). Use the scores so far to choose the next <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.294ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 572 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container>, and repeat. No formula for <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.244ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 550 910"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D453" d="M118 -162Q120 -162 124 -164T135 -167T147 -168Q160 -168 171 -155T187 -126Q197 -99 221 27T267 267T289 382V385H242Q195 385 192 387Q188 390 188 397L195 425Q197 430 203 430T250 431Q298 431 298 432Q298 434 307 482T319 540Q356 705 465 705Q502 703 526 683T550 630Q550 594 529 578T487 561Q443 561 443 603Q443 622 454 636T478 657L487 662Q471 668 457 668Q445 668 434 658T419 630Q412 601 403 552T387 469T380 433Q380 431 435 431Q480 431 487 430T498 424Q499 420 496 407T491 391Q489 386 482 386T428 385H372L349 263Q301 15 282 -47Q255 -132 212 -173Q175 -205 139 -205Q107 -205 81 -186T55 -132Q55 -95 76 -78T118 -61Q162 -61 162 -103Q162 -122 151 -136T127 -157L118 -162Z"></path></g></g></g></svg></mjx-container> is available, only evaluations.</p>
<p><strong>DSPy packages this.</strong> You write a &quot;program&quot;: Python code that chains several LLM calls (&quot;modules&quot;), each declared by its inputs and outputs — e.g. question → search query, then passages → answer. Each call gets its own prompt. You also supply training examples and a scoring function.</p>
<p><strong>The search space is categorical.</strong> Candidate pool for each call: <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.009ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 888 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g></g></g></svg></mjx-container> instructions written by an LLM, and <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.009ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 888 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g></g></g></svg></mjx-container> sets of worked examples taken from the model's own correct runs on training questions. A prompt <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.294ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 572 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container> is then one instruction and one example set per call — a list of indices. <strong>Bayesian optimization</strong> (a black-box optimization method we'll learn soon) searches over those choices.</p>
<p><strong>Limitations.</strong> Tuned prompts overfit the dev set: they often scored 5–20% higher on the questions they were tuned on than on held-out questions.</p>

<h1 id="reasoning--doing-scratch-work">Reasoning = doing scratch work</h1>

<p>One forward pass through the LLM produces one token and uses a fixed amount of computation.</p>
<p>Idea: more computation usually generates better answers. Let's <strong>run more forward passes</strong> to generate more tokens (scratch work) before we generate our final answer (&quot;test-time compute&quot;).</p>
<p>Each &quot;scratch work&quot; token gets appended to the input, so influences later tokens. (It is <strong>memory of the work</strong>.)</p>
<div class="box">
<p><strong>Intuition</strong>: Ask a mathematician for a multi-step proof.</p>
<ul>
<li>if you ask them to state the proof instantly, out loud, it won't be very good</li>
<li>if you let them use a blackboard to write out some scratch work, it will be better.</li>
</ul>
</div>
<p><span class="cite">Photo: alegri / 4freephotos.com, via Wikimedia Commons, CC BY 3.0</span></p>

<h1 id="reasoning-models-put-scratch-work-between-think-tags">Reasoning models put scratch work between <code>&lt;think&gt;</code> tags</h1>
<p>A reasoning model's output follows a template:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&lt;think&gt; scratch work … &lt;/think&gt; final answer &lt;end-of-sequence&gt;
</code></pre>
<p><code>&lt;think&gt;</code> and <code>&lt;/think&gt;</code> are output the model learns to emit, generated by the same loop as every other token: predict a token, append it, repeat.</p>
<ol>
<li>The model emits <code>&lt;think&gt;</code>, then its scratch work.</li>
<li>It emits <code>&lt;/think&gt;</code> when it judges the scratch work done.</li>
<li>It writes the final answer, then emits the <strong>end-of-sequence token</strong>, and generation stops.</li>
</ol>
<p>Chat interfaces usually collapse the text between the tags and show the final answer.</p>

<h1 id="the-tags-can-come-from-the-prompt-or-from-sft">The tags can come from the prompt or from SFT</h1>
<p><span class="cite">Nye, Andreassen, Gur-Ari, Michalewski, Austin, Bieber, Dohan, Lewkowycz, Bosma, Luan, Sutton, Odena. <em>Show Your Work: Scratchpads for Intermediate Computation with Language Models</em>. arXiv:2112.00114 · DeepSeek-AI. <em>DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning</em>. Nature 645, 633–638 (2025), Table 1</span></p>
<p><strong>From the prompt.</strong> Describe the template in the prompt. A pretrained model follows an explicit format instruction some of the time. <em>&quot;Let's think step by step&quot;</em> and worked examples (&quot;chain-of-thought prompting&quot;) are this idea without the tags.</p>
<p><strong>From SFT.</strong> Fine-tune on examples whose answers contain the tags and the worked steps. Those tokens are then what the model is trained to predict next.</p>
<ul>
<li>Fine-tuning a model to write its steps into a delimited &quot;scratchpad&quot; dates to 2021 (Nye et al.).</li>
<li>DeepSeek-R1's training starts with SFT on thousands of long worked solutions (&quot;cold start&quot;).</li>
</ul>
<p><strong>The cost of SFT</strong> is that someone, or some other model, has to write the worked solutions.</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="rl-rewards-scratch-work-that-leads-to-right-answers">RL rewards scratch work that leads to right answers</h1>
<p><span class="cite">DeepSeek-AI. <em>DeepSeek-R1 incentivizes reasoning in LLMs through reinforcement learning</em>. Nature 645, 633–638 (2025), Table 1, Fig. 1, Fig. 2</span></p>
<p><strong>RL needs checkable answers, not worked solutions.</strong> DeepSeek-R1-Zero had no SFT:</p>
<ol>
<li>Every training prompt spells out the <code>&lt;think&gt;</code> template.</li>
<li>For each math or code problem, sample a group of responses.</li>
<li>Raise the probability of those that got the answer right (&quot;accuracy reward&quot;) and used the tags (&quot;format reward&quot;).</li>
</ol>
<p>RL training also sets how long a model tends to think.</p>
<p><strong>The released DeepSeek-R1 uses both</strong> — cold-start SFT, then RL, a second round of SFT, and more RL.</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>

<h1 id="serving-code-can-cap-or-extend-thinking">Serving code can cap or extend thinking</h1>
<p><span class="cite">Muennighoff, Yang, Shi, Li, Fei-Fei, Hajishirzi, Zettlemoyer, Liang, Candès, Hashimoto. <em>s1: Simple test-time scaling</em>. arXiv:2501.19393</span></p>
<p><strong>To cap thinking</strong>, the serving code inserts <code>&lt;/think&gt;</code> itself, and the model goes on to the answer.</p>
<p><strong>To extend it</strong>, the code deletes the model's <code>&lt;/think&gt;</code> and appends &quot;Wait&quot; (&quot;budget forcing&quot;).</p>
<p>Vendors expose this as a &quot;thinking budget&quot; or an effort level. Generation also stops when the output hits a length cap (&quot;max tokens&quot;).</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="longer-thinking-pays-on-multi-step-checkable-tasks">Longer thinking pays on multi-step, checkable tasks</h1>
<table>
<thead>
<tr>
<th>Let it think</th>
<th>Do not bother</th>
</tr>
</thead>
<tbody>
<tr>
<td>Many dependent steps — derivations, stoichiometry, planning an assay</td>
<td>One-shot recall: a melting point, a CAS number</td>
</tr>
<tr>
<td>A candidate space to search and prune</td>
<td>Reformatting, extraction, translation</td>
</tr>
<tr>
<td>A checkable answer, so you can tell if it worked</td>
<td>Anything where you cannot tell a good answer from a bad one</td>
</tr>
<tr>
<td>A wrong answer is expensive to discover later</td>
<td>Latency matters and errors are cheap</td>
</tr>
</tbody>
</table>
<p><strong>Thinking does not add knowledge.</strong> If a fact was never in the training data, more tokens give the model more room to argue for a wrong answer. Retrieving the fact takes a tool.</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="a-tool-call-is-text-your-code-agrees-to-execute">A tool call is text your code agrees to execute</h1>
<p>The model only emits text. Your code treats text in one agreed format as a request to run a function (&quot;tool call&quot;).</p>
<div class="columns">
<div>
<p><strong>1. You describe the tool</strong> — a name, a description, and the allowed inputs (&quot;JSON schema&quot;). This text goes into the prompt.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;run_rdkit&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;description&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Compute a molecular
   property from a SMILES string.&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;input_schema&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
   <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;object&quot;</span><span class="hljs-punctuation">,</span>
   <span class="hljs-attr">&quot;properties&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
     <span class="hljs-attr">&quot;smiles&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;string&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
     <span class="hljs-attr">&quot;property&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;string&quot;</span><span class="hljs-punctuation">,</span>
        <span class="hljs-attr">&quot;enum&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;logP&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-string">&quot;MW&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-string">&quot;TPSA&quot;</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
   <span class="hljs-attr">&quot;required&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;smiles&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-string">&quot;property&quot;</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">}</span>
</code></pre>
<p>The model decides whether to call the tool from that text alone.</p>
</div>
<div>
<p><strong>2. The model emits a call</strong>, and generation stops.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;tool_use&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;toolu_01&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;run_rdkit&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;input&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;smiles&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;CC(=O)Oc1ccccc1C(=O)O&quot;</span><span class="hljs-punctuation">,</span>
           <span class="hljs-attr">&quot;property&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;logP&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>3. Your code runs the function</strong> and appends the result to the conversation.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;tool_result&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;tool_use_id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;toolu_01&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;1.31&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>4. The model is called again</strong>, with the result now in its prompt. It writes the answer (<em>&quot;Aspirin's logP is about 1.31&quot;</em>) or another tool call.</p>
</div>
</div>

<h1 id="tool-calling-is-a-skill-trained-in-post-training">Tool calling is a skill trained in post-training</h1>
<p><strong>At run time, the tool definitions are text in the prompt.</strong> The API writes your definitions into a system prompt (&quot;Here are the functions available in JSONSchema format: …&quot;). The model writes the call in a format it was trained on, generation stops, and the server parses that text into the JSON on the previous slide. An option (&quot;strict&quot;) guarantees the inputs match the schema.</p>
<p><strong>The skill comes from fine-tuning.</strong> Llama 3 was trained on transcripts of the form <em>system prompt → user prompt → tool call → tool output → final answer</em>, generated by earlier Llama 3 checkpoints, with failed calls filtered out. Annotators then picked the better of two assistant messages at each step. For tools it has never seen, it trained on (function definition, query, correct call) triples mined from public code.</p>
<p><span class="cite">Anthropic. <em>Define tools</em>, platform.claude.com/docs · Llama Team, AI @ Meta. <em>The Llama 3 Herd of Models</em>. arXiv:2407.21783, §4.3.5</span></p>

<h1 id="retrieval-puts-missing-facts-into-the-prompt">Retrieval puts missing facts into the prompt</h1>
<p><span class="cite">Lewis et al. <em>Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks</em>. NeurIPS 2020. arXiv:2005.11401 · Skarlinski, Cox, Laurent, Braza, Hinks, Hammerling, Ponnapati, Rodriques, White. <em>Language agents achieve superhuman synthesis of scientific knowledge</em>. arXiv:2409.13740</span></p>
<p><strong>Retrieval-augmented generation (&quot;RAG&quot;).</strong> Search a document collection — papers, lab notebooks, a database — and paste the top passages into the prompt before the model answers. The model answers from text it was given, and can cite the passage.</p>
<p><strong>As a fixed pipeline</strong> — your code always searches once, then calls the model: question → retrieve passages → answer. This is the original 2020 design.</p>
<p><strong>As a tool</strong> — the model decides when to search, reads the results, and can search again with a better query. PaperQA2 works this way, with paper search, evidence gathering, and citation following as tools. Its authors report it matched or exceeded subject-matter experts on three literature-research tasks.</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="most-callable-code-can-be-a-tool-with-four-exceptions">Most callable code can be a tool, with four exceptions</h1>
<div class="columns">
<div>
<p><strong>Yes</strong></p>
<ul>
<li>RDKit, a solver, a simulation, a unit converter</li>
<li>Literature and patent search; a lab database</li>
<li>Instruments with an API — a plate reader, a liquid handler</li>
<li>Another model, including this one</li>
</ul>
</div>
<div>
<p><strong>No</strong></p>
<ul>
<li>Anything returning nothing observable</li>
<li>A three-day fermentation — too slow for the loop; make it a job you submit and poll</li>
<li>Judgment nobody can specify: <em>&quot;is this hypothesis interesting?&quot;</em></li>
<li><strong>Irreversible acts</strong> — deleting data, ordering reagents, dispensing. Callable, but excluded for safety.</li>
</ul>
</div>
</div>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="mcp-servers-package-tools-for-any-ai-application">MCP servers package tools for any AI application</h1>
<p><span class="cite">Model Context Protocol. <em>Architecture overview</em>. modelcontextprotocol.io/docs/learn/architecture, accessed 2026-10-04 · Anthropic. <em>Donating the Model Context Protocol and establishing the Agentic AI Foundation</em>. 9 Dec 2025</span></p>
<p><strong>Without MCP</strong>, a tool is written into one application's code: its definition and the function that runs it.</p>
<p><strong>An MCP server is a program that offers tools over a standard protocol</strong> (&quot;Model Context Protocol&quot;). An AI application — Claude Code, ChatGPT, Cursor, VS Code — connects to it and:</p>
<ol>
<li>asks for its tools (<code>tools/list</code>) and gets each one's name, description, and input schema</li>
<li>puts those definitions in the prompt, like any other tool</li>
<li>forwards the model's call to the server (<code>tools/call</code>) and appends the result to the context</li>
</ol>
<p><strong>Local or remote.</strong> A local server runs on your machine, e.g. one that reads your files. A remote server runs on the provider's platform, behind a login.</p>
<p><strong>In practice.</strong> More than 10,000 public servers existed by December 2025. A server's tool descriptions and results enter the model's context, so connect only servers you trust.</p>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="an-agent-calls-tools-in-a-loop-until-its-goal-is-met">An agent calls tools in a loop until its goal is met</h1>
<p><img src="images/agent-loop.svg" alt="center" style="width:820px;" /></p>
<div class="box">
<p><strong>An agent is a language model in a loop, given a goal instead of a question, with tools that reach outside itself, deciding its own next action until it stops.</strong></p>
</div>
<p>Unlike a chatbot, an agent:</p>
<ol>
<li>chooses its own next action instead of answering one question</li>
<li>runs many steps before a human sees the result</li>
<li>acts on files, databases, and instruments outside the conversation</li>
</ol>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="the-loop-is-a-program-that-calls-the-model-repeatedly">The loop is a program that calls the model repeatedly</h1>
<div class="columns">
<div>
<p><strong>The program around the model (&quot;harness&quot;)</strong> is ordinary code. On every pass it:</p>
<ol>
<li><strong>Sends the whole transcript as the prompt</strong> — the goal, the tool definitions, and every tool call and result so far. The model keeps no memory between calls.</li>
<li><strong>Runs the tool call</strong> the model emits and appends the result to the transcript.</li>
<li><strong>Stops</strong> when the model answers without a tool call, or at a cap on steps or cost that you set.</li>
</ol>
<p>The transcript grows on every pass, so a long run fills the context window. The harness decides what to keep.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>call 1  prompt: goal + tool definitions
        model:  search_papers(&quot;aspirin logP&quot;)

call 2  prompt: all of the above
                + search results
        model:  run_rdkit(aspirin, logP)

call 3  prompt: all of the above + &quot;1.31&quot;
        model:  final answer, no tool call
                → stop
</code></pre>
<p><strong>Three ways to get a harness:</strong> use an existing one (Claude Code, Codex CLI), write the loop yourself, or build on a framework (LangGraph).</p>
</div>
</div>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>

<h1 id="workflow-code-picks-each-step-agent-the-model-does">Workflow: code picks each step. Agent: the model does.</h1>
<p><span class="cite">Schluntz, Zhang. <em>Building Effective Agents</em>. Anthropic, Dec 2024. anthropic.com/engineering/building-effective-agents</span></p>
<div class="columns">
<div>
<p><img src="images/workflow-fixed.svg" alt="center" style="width:540px;" /></p>
<p><strong>A workflow</strong> — LLM calls and tools &quot;orchestrated through predefined code paths.&quot; Your code decides which step runs next. The LLM does one step and cannot choose another.</p>
<p><strong>Use it when you can list the steps ahead of time.</strong> Workflows &quot;offer predictability and consistency for well-defined tasks.&quot;</p>
</div>
<div>
<p><img src="images/agent-choice.svg" alt="center" style="width:540px;" /></p>
<p><strong>An agent</strong> — the LLM &quot;dynamically direct[s] [its] own processes and tool usage.&quot; The harness has one generic step: run whichever tool the model asks for.</p>
<p><strong>Use it when you cannot list the steps.</strong> Agents &quot;trade latency and cost for better task performance.&quot;</p>
</div>
</div>
<footer>ORIE 7190 · AI for Science · Prompting, reasoning, and tools</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="ORIE 7190 · AI for Science · Prompting, reasoning, and tools" data-theme="gaia" data-style="section { font-size: 23px; padding: 50px 60px 60px; }

<h1 id="the-same-model-scores-differently-across-harnesses">The same model scores differently across harnesses</h1>
<p><span class="cite">Yang, Jimenez, Wettig, Lieret, Yao, Narasimhan, Press. <em>SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering</em>. NeurIPS 2024. arXiv:2405.15793, Tables 1, 3 · HAL leaderboard, CORE-Bench Hard, hal.cs.princeton.edu/corebench_hard, accessed 2026-10-04</span></p>
<p><strong>A harness is the software around the model</strong> — the loop, the tool definitions, what goes into the context window, which actions need permission, when to stop. Claude Code, Codex CLI, and SWE-agent are harnesses.</p>
<p><strong>Better tools, same model.</strong> On 300 GitHub bug-fix tasks (SWE-bench Lite), GPT-4 Turbo fixed 11% using a plain Linux shell and 18% using SWE-agent's file viewer, search, and editor. Showing only the last five tool outputs in full beat showing the whole history, 18% to 15%.</p>
<p><strong>Same model, three harnesses.</strong> Reproducing results from published papers' code and data (CORE-Bench Hard), Claude Opus 4.5 scored 33% in a general-purpose harness, 42% in one tuned for the benchmark, and 78% in Claude Code. These were separate leaderboard submissions, not a controlled comparison.</p>
