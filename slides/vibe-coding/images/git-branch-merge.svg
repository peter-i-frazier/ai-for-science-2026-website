<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 1000 276" width="1000" height="276" font-family="Helvetica, Arial, sans-serif">

  <!-- ============ main line ============ -->
  <line x1="105" y1="150" x2="900" y2="150" stroke="#B31B1B" stroke-width="3"/>

  <text x="25" y="145" font-size="21" font-weight="bold" fill="#B31B1B">main</text>
  <text x="25" y="171" font-size="17" fill="#666">your working code</text>

  <!-- ============ branch A: merged back ============ -->
  <path d="M 259 143 C 296 118, 322 68, 361 61" fill="none" stroke="#B31B1B" stroke-width="3"/>
  <line x1="370" y1="60" x2="610" y2="60" stroke="#B31B1B" stroke-width="3"/>
  <path d="M 619 66 C 658 78, 698 126, 730 145" fill="none" stroke="#B31B1B" stroke-width="3"/>

  <text x="490" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">agent session &#8212; safe to break</text>
  <text x="368" y="96" font-size="17" font-family="Menlo, Consolas, monospace" fill="#777">git switch -c agent-a</text>

  <!-- ============ branch B: discarded ============ -->
  <path d="M 259 157 C 296 182, 322 233, 361 240" fill="none" stroke="#999" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="370" y1="240" x2="490" y2="240" stroke="#999" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="502" y1="240" x2="558" y2="240" stroke="#999" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- dead-end cross -->
  <line x1="570" y1="230" x2="592" y2="250" stroke="#999" stroke-width="3"/>
  <line x1="592" y1="230" x2="570" y2="250" stroke="#999" stroke-width="3"/>

  <text x="368" y="274" font-size="20" font-weight="bold" fill="#777">a second attempt &#8212; didn&#8217;t pan out, throw it away</text>

  <!-- ============ commits ============ -->
  <circle cx="140" cy="150" r="12" fill="#ffffff" stroke="#B31B1B" stroke-width="3"/>
  <circle cx="250" cy="150" r="12" fill="#ffffff" stroke="#B31B1B" stroke-width="3"/>
  <circle cx="860" cy="150" r="12" fill="#ffffff" stroke="#B31B1B" stroke-width="3"/>
  <circle cx="740" cy="150" r="14" fill="#B31B1B" stroke="#B31B1B" stroke-width="3"/>

  <circle cx="370" cy="60" r="12" fill="#ffffff" stroke="#B31B1B" stroke-width="3"/>
