  <circle cx="490" cy="240" r="12" fill="#ffffff" stroke="#999" stroke-width="2.5"/>

  <!-- ============ merge label ============ -->
  <text x="740" y="198" text-anchor="middle" font-size="20" font-weight="bold" fill="#B31B1B">merge back what worked</text>
  <text x="740" y="222" text-anchor="middle" font-size="17" font-family="Menlo, Consolas, monospace" fill="#777">git switch main &amp;&amp; git merge agent-a</text>
