<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" font-family="Helvetica, Arial, sans-serif">
  <!-- Energy is invariant under rotation; forces are equivariant -->
  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#1b4b8f"/>
    </marker>
    <marker id="rot" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#B31B1B"/>
    </marker>
  </defs>

  <!-- ============ left: original ============ -->
  <rect x="25" y="38" width="395" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="222" y="27" text-anchor="middle" font-size="17" font-weight="bold" fill="#B31B1B">original</text>
  <g stroke="#bbb" stroke-width="3">
    <line x1="175" y1="112" x2="250" y2="102"/>
    <line x1="250" y1="102" x2="230" y2="182"/>
  </g>
  <g stroke="#1b4b8f" stroke-width="2.5" marker-end="url(#f)">
    <line x1="175" y1="112" x2="149" y2="78"/>
    <line x1="250" y1="102" x2="297" y2="89"/>
    <line x1="230" y1="182" x2="251" y2="225"/>
  </g>
  <circle cx="175" cy="112" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <circle cx="250" cy="102" r="13" fill="#B31B1B" stroke="#7d1212" stroke-width="2.5"/>
  <circle cx="230" cy="182" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="222" y="262" text-anchor="middle" font-size="18" fill="#333">E = &#8722;4.21 eV</text>

  <!-- ============ rotation arrow ============ -->
  <path d="M 432,120 Q 452,98 472,120" fill="none" stroke="#B31B1B" stroke-width="2.5" marker-end="url(#rot)"/>
  <text x="452" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#B31B1B">rotate</text>

  <!-- ============ right: rotated ============ -->
  <rect x="483" y="38" width="392" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="679" y="27" text-anchor="middle" font-size="17" font-weight="bold" fill="#B31B1B">rotated 70&#176;</text>
  <g stroke="#bbb" stroke-width="3">
    <line x1="679" y1="106" x2="714" y2="174"/>
    <line x1="714" y1="174" x2="632" y2="182"/>
  </g>
  <g stroke="#1b4b8f" stroke-width="2.5" marker-end="url(#f)">
    <line x1="679" y1="106" x2="702" y2="71"/>
    <line x1="714" y1="174" x2="742" y2="213"/>
    <line x1="632" y1="182" x2="600" y2="217"/>
  </g>
  <circle cx="679" cy="106" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <circle cx="714" cy="174" r="13" fill="#B31B1B" stroke="#7d1212" stroke-width="2.5"/>
  <circle cx="632" cy="182" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="679" y="262" text-anchor="middle" font-size="18" fill="#333">E = &#8722;4.21 eV &#160;&#8212;&#160; the same number</text>
</svg>
