<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 268" font-family="Helvetica, Arial, sans-serif">

  <!-- axes -->
  <line x1="52" y1="228" x2="430" y2="228" stroke="#555" stroke-width="2"/>
  <line x1="52" y1="228" x2="52" y2="38" stroke="#555" stroke-width="2"/>
  <text x="436" y="233" font-size="14" font-style="italic" fill="#333">t</text>
  <text x="46" y="28" font-size="14" fill="#333">sup</text>
  <text x="76" y="28" font-size="14" font-style="italic" fill="#333">|u(x,t)|</text>

  <!-- the solution stays smooth, then runs away -->
  <path d="M62,206 C150,199 235,184 288,146 C316,124 331,86 334,44"
        fill="none" stroke="#B31B1B" stroke-width="3.5" stroke-linecap="round"/>

  <!-- finite blowup time -->
  <line x1="334" y1="228" x2="334" y2="36" stroke="#B31B1B" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="334" y="248" text-anchor="middle" font-size="14" font-style="italic" fill="#B31B1B">T</text>
  <text x="352" y="60" font-size="17" font-weight="bold" fill="#B31B1B">&#8594; &#8734;</text>

  <!-- smooth region -->
  <text x="150" y="220" font-size="13" fill="#777">smooth solution</text>


  <!-- caption -->
  <text x="230" y="266" text-anchor="middle" font-size="13" fill="#666">Whether this can happen is the open problem.</text>
</svg>
