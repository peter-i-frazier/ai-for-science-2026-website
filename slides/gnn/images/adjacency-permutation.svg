<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" font-family="Helvetica, Arial, sans-serif">
  <!-- ============ NUMBERING A ============ -->
  <text x="200" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">Numbering A</text>
  <g stroke="#777" stroke-width="2">
    <line x1="60" y1="90" x2="110" y2="60"/>
    <line x1="110" y1="60" x2="160" y2="90"/>
    <line x1="110" y1="60" x2="110" y2="130"/>
  </g>
  <g>
    <circle cx="60" cy="90" r="15" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="110" cy="60" r="15" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="160" cy="90" r="15" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="110" cy="130" r="15" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
  </g>
  <text x="60" y="96" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="110" y="66" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="160" y="96" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="110" y="136" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- matrix A : edges 1-2, 2-3, 2-4 -->
  <text x="236" y="50" font-size="15" fill="#888">1 2 3 4</text>
  <g font-size="15" fill="#888" text-anchor="end">
    <text x="212" y="80">1</text>
    <text x="212" y="102">2</text>
    <text x="212" y="124">3</text>
    <text x="212" y="146">4</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="236" y="80">0 1 0 0</text>
    <text x="236" y="102">1 0 1 1</text>
    <text x="236" y="124">0 1 0 0</text>
    <text x="236" y="146">0 1 0 0</text>
  </g>
  <path d="M230,62 L224,62 L224,152 L230,152" fill="none" stroke="#555" stroke-width="1.5"/>
  <path d="M320,62 L326,62 L326,152 L320,152" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- ============ NUMBERING B ============ -->
  <text x="200" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">Numbering B</text>
  <text x="200" y="225" text-anchor="middle" font-size="13" fill="#777">same molecule, relabeled</text>
  <g stroke="#777" stroke-width="2">
    <line x1="60" y1="293" x2="110" y2="263"/>
    <line x1="110" y1="263" x2="160" y2="293"/>
    <line x1="110" y1="263" x2="110" y2="333"/>
  </g>
  <g>
    <circle cx="60" cy="293" r="15" fill="#f5e2c9" stroke="#d98324" stroke-width="2"/>
    <circle cx="110" cy="263" r="15" fill="#f5e2c9" stroke="#d98324" stroke-width="2"/>
    <circle cx="160" cy="293" r="15" fill="#f5e2c9" stroke="#d98324" stroke-width="2"/>
    <circle cx="110" cy="333" r="15" fill="#f5e2c9" stroke="#d98324" stroke-width="2"/>
  </g>
  <text x="60" y="299" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="110" y="269" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="160" y="299" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="110" y="339" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- matrix B : edges 1-3, 1-4, 1-2 -->
  <text x="236" y="253" font-size="15" fill="#888">1 2 3 4</text>
  <g font-size="15" fill="#888" text-anchor="end">
    <text x="212" y="283">1</text>
    <text x="212" y="305">2</text>
    <text x="212" y="327">3</text>
    <text x="212" y="349">4</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="236" y="283">0 1 1 1</text>
    <text x="236" y="305">1 0 0 0</text>
    <text x="236" y="327">1 0 0 0</text>
    <text x="236" y="349">1 0 0 0</text>
  </g>
  <path d="M230,265 L224,265 L224,355 L230,355" fill="none" stroke="#555" stroke-width="1.5"/>
  <path d="M320,265 L326,265 L326,355 L320,355" fill="none" stroke="#555" stroke-width="1.5"/>
</svg>
