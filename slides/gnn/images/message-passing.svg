<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#B31B1B"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== STEP 1 : GATHER ===== -->
  <text x="140" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">1 · Gather</text>
  <text x="140" y="46" text-anchor="middle" font-size="13" fill="#666">collect neighbors' vectors</text>
  <rect x="20" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <g stroke="#ccc" stroke-width="2">
    <line x1="80" y1="130" x2="140" y2="160"/>
    <line x1="200" y1="130" x2="140" y2="160"/>
    <line x1="140" y1="220" x2="140" y2="160"/>
  </g>
  <!-- message arrows into centre -->
  <g stroke="#B31B1B" stroke-width="2.5" marker-end="url(#m1)">
    <line x1="88" y1="134" x2="126" y2="153"/>
    <line x1="192" y1="134" x2="154" y2="153"/>
    <line x1="140" y1="211" x2="140" y2="180"/>
  </g>
  <g>
    <circle cx="80" cy="130" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="200" cy="130" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="140" cy="220" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="140" cy="165" r="18" fill="#f5c9c9" stroke="#B31B1B" stroke-width="3"/>
  </g>
  <text x="80" y="135" text-anchor="middle" font-size="13" fill="#333">hᵤ₁</text>
  <text x="200" y="135" text-anchor="middle" font-size="13" fill="#333">hᵤ₂</text>
  <text x="140" y="225" text-anchor="middle" font-size="13" fill="#333">hᵤ₃</text>
  <text x="140" y="170" text-anchor="middle" font-size="13" fill="#333">h_v</text>
  <text x="140" y="248" text-anchor="middle" font-size="12" fill="#777">v is the node being updated</text>

  <line x1="268" y1="158" x2="300" y2="158" stroke="#888" stroke-width="3" marker-end="url(#m2)"/>

  <!-- ===== STEP 2 : AGGREGATE ===== -->
  <text x="435" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">2 · Aggregate</text>
  <text x="435" y="46" text-anchor="middle" font-size="13" fill="#666">a permutation-invariant sum</text>
  <rect x="315" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <!-- three little vectors stacked -->
  <g>
    <rect x="360" y="86" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <rect x="366" y="86" width="14" height="17" fill="#4a7fb5"/>
    <rect x="402" y="86" width="14" height="17" fill="#4a7fb5"/>
    <rect x="360" y="110" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <rect x="384" y="110" width="14" height="17" fill="#4a7fb5"/>
    <rect x="456" y="110" width="14" height="17" fill="#4a7fb5"/>
    <rect x="360" y="134" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <rect x="420" y="134" width="14" height="17" fill="#4a7fb5"/>
    <rect x="480" y="134" width="14" height="17" fill="#4a7fb5"/>
  </g>
  <text x="345" y="123" text-anchor="middle" font-size="24" fill="#B31B1B">Σ</text>
  <line x1="360" y1="162" x2="510" y2="162" stroke="#555" stroke-width="2"/>
  <g>
    <rect x="360" y="172" width="150" height="19" fill="#f5e2c9" stroke="#d98324" stroke-width="1.5"/>
    <rect x="366" y="172" width="14" height="19" fill="#d98324"/>
    <rect x="384" y="172" width="14" height="19" fill="#d98324"/>
    <rect x="402" y="172" width="14" height="19" fill="#d98324"/>
    <rect x="420" y="172" width="14" height="19" fill="#d98324"/>
    <rect x="456" y="172" width="14" height="19" fill="#d98324"/>
    <rect x="480" y="172" width="14" height="19" fill="#d98324"/>
  </g>
  <text x="435" y="210" text-anchor="middle" font-size="14" fill="#333">m_v — the message</text>
  <text x="435" y="234" text-anchor="middle" font-size="12" fill="#777">order of the three inputs cannot matter</text>

  <line x1="563" y1="158" x2="595" y2="158" stroke="#888" stroke-width="3" marker-end="url(#m2)"/>

  <!-- ===== STEP 3 : UPDATE ===== -->
  <text x="730" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">3 · Update</text>
  <text x="730" y="46" text-anchor="middle" font-size="13" fill="#666">a small neural network</text>
  <rect x="610" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="668" y="104" text-anchor="middle" font-size="14" fill="#333">h_v</text>
  <text x="668" y="146" text-anchor="middle" font-size="14" fill="#333">m_v</text>
  <rect x="700" y="96" width="80" height="54" rx="6" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="740" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#B31B1B">MLP</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#8a3030">learned</text>
  <g stroke="#555" stroke-width="2" marker-end="url(#m2)">
    <line x1="682" y1="100" x2="694" y2="112"/>
    <line x1="682" y1="142" x2="694" y2="132"/>
  </g>
  <line x1="740" y1="156" x2="740" y2="178" stroke="#555" stroke-width="2" marker-end="url(#m2)"/>
  <circle cx="740" cy="200" r="19" fill="#f5c9c9" stroke="#B31B1B" stroke-width="3"/>
  <text x="740" y="205" text-anchor="middle" font-size="12" fill="#333">h_v′</text>
  <text x="730" y="240" text-anchor="middle" font-size="12" fill="#777">ECFP hard-coded this as a hash</text>

  <line x1="858" y1="158" x2="890" y2="158" stroke="#888" stroke-width="3" marker-end="url(#m2)"/>

  <!-- ===== REPEAT ===== -->
  <rect x="900" y="88" width="90" height="140" rx="8" fill="#fbeeee" stroke="#B31B1B" stroke-width="2"/>
  <text x="945" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">repeat</text>
  <text x="945" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">K times</text>

  <!-- bottom note -->
  <rect x="20" y="278" width="970" height="46" rx="8" fill="#fbeeee" stroke="#B31B1B" stroke-width="2"/>
  <text x="505" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">Every node runs this at the same time, with the same MLP.</text>
  <text x="505" y="317" text-anchor="middle" font-size="13.5" fill="#8a3030">Weight sharing is what makes it work on any molecule size.</text>
</svg>
