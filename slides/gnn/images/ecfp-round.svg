<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#B31B1B"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== STEP 1 : GATHER ===== -->
  <text x="140" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">1 · Gather</text>
  <text x="140" y="46" text-anchor="middle" font-size="13" fill="#666">collect neighbors' identifiers</text>
  <rect x="20" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <g stroke="#ccc" stroke-width="2">
    <line x1="80" y1="130" x2="140" y2="160"/>
    <line x1="200" y1="130" x2="140" y2="160"/>
    <line x1="140" y1="220" x2="140" y2="160"/>
  </g>
  <g stroke="#B31B1B" stroke-width="2.5" marker-end="url(#e1)">
    <line x1="88" y1="134" x2="126" y2="153"/>
    <line x1="192" y1="134" x2="154" y2="153"/>
    <line x1="140" y1="211" x2="140" y2="180"/>
  </g>
  <g>
    <circle cx="80" cy="130" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="200" cy="130" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="140" cy="220" r="16" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
    <circle cx="140" cy="165" r="18" fill="#f5c9c9" stroke="#B31B1B" stroke-width="3"/>
  </g>
  <text x="80" y="135" text-anchor="middle" font-size="12" fill="#333">219</text>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#333">847</text>
  <text x="140" y="225" text-anchor="middle" font-size="12" fill="#333">331</text>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#333">105</text>
  <text x="140" y="248" text-anchor="middle" font-size="12" fill="#777">each integer starts as 7 atom features</text>

  <line x1="268" y1="158" x2="300" y2="158" stroke="#888" stroke-width="3" marker-end="url(#e2)"/>

  <!-- ===== STEP 2 : AGGREGATE ===== -->
  <text x="435" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">2 · Aggregate</text>
  <text x="435" y="46" text-anchor="middle" font-size="13" fill="#666">(into a sorted list)</text>
  <rect x="315" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <g font-size="13" fill="#333">
    <rect x="360" y="86" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <text x="435" y="99" text-anchor="middle">(1, 847)</text>
    <rect x="360" y="110" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <text x="435" y="123" text-anchor="middle">(2, 331)</text>
    <rect x="360" y="134" width="150" height="17" fill="#e8eef5" stroke="#4a7fb5"/>
    <text x="435" y="147" text-anchor="middle">(1, 219)</text>
  </g>
  <text x="341" y="124" text-anchor="middle" font-size="15" fill="#B31B1B">sort</text>
  <line x1="360" y1="162" x2="510" y2="162" stroke="#555" stroke-width="2"/>
  <rect x="360" y="172" width="150" height="19" fill="#f5e2c9" stroke="#d98324" stroke-width="1.5"/>
  <text x="435" y="186" text-anchor="middle" font-size="12" fill="#333">(1,219)(1,847)(2,331)</text>
  <text x="435" y="210" text-anchor="middle" font-size="14" fill="#333">the neighborhood list</text>
  <text x="435" y="234" text-anchor="middle" font-size="12" fill="#777">order of the three inputs cannot matter</text>

  <line x1="563" y1="158" x2="595" y2="158" stroke="#888" stroke-width="3" marker-end="url(#e2)"/>

  <!-- ===== STEP 3 : HASH ===== -->
  <text x="730" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">3 · Hash</text>
  <text x="730" y="46" text-anchor="middle" font-size="13" fill="#666">a fixed hash function</text>
  <rect x="610" y="58" width="240" height="200" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="664" y="104" text-anchor="middle" font-size="13" fill="#333">105</text>
  <text x="664" y="146" text-anchor="middle" font-size="13" fill="#333">list</text>
  <rect x="700" y="96" width="80" height="54" rx="6" fill="#e8e8e8" stroke="#555" stroke-width="2.5"/>
  <text x="740" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HASH</text>
  <text x="740" y="140" text-anchor="middle" font-size="12" fill="#666">fixed</text>
  <g stroke="#555" stroke-width="2" marker-end="url(#e2)">
    <line x1="678" y1="100" x2="694" y2="112"/>
    <line x1="678" y1="142" x2="694" y2="132"/>
  </g>
  <line x1="740" y1="156" x2="740" y2="178" stroke="#555" stroke-width="2" marker-end="url(#e2)"/>
  <circle cx="740" cy="200" r="19" fill="#f5c9c9" stroke="#B31B1B" stroke-width="3"/>
  <text x="740" y="205" text-anchor="middle" font-size="12" fill="#333">2894</text>
  <text x="730" y="240" text-anchor="middle" font-size="12" fill="#777">no parameters, no labels, no gradients</text>

  <line x1="858" y1="158" x2="890" y2="158" stroke="#888" stroke-width="3" marker-end="url(#e2)"/>

  <!-- ===== REPEAT ===== -->
  <rect x="900" y="88" width="90" height="140" rx="8" fill="#fbeeee" stroke="#B31B1B" stroke-width="2"/>
  <text x="945" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">repeat</text>
  <text x="945" y="164" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">K times</text>

  <!-- bottom note -->
  <rect x="20" y="278" width="970" height="46" rx="8" fill="#fbeeee" stroke="#B31B1B" stroke-width="2"/>
  <text x="505" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#B31B1B">Every atom runs this at the same time, with the same hash function.</text>
  <text x="505" y="317" text-anchor="middle" font-size="13.5" fill="#8a3030">Collect every identifier produced along the way, fold them into a fixed-width bit vector, and that is the fingerprint.</text>
</svg>
