<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" font-family="Helvetica, Arial, sans-serif">

  <!-- backbone: consecutive residues -->
  <g stroke="#999" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M65,100 L110,100 L155,100 L200,100 L245,100
             Q285,100 288,140 Q291,178 250,178
             L205,178 L160,178 L115,178 L70,178"/>
  </g>

  <!-- contact edges: far apart in sequence, close in space -->
  <g stroke="#B31B1B" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="110" y1="112" x2="115" y2="166"/>
    <line x1="200" y1="112" x2="205" y2="166"/>
  </g>

  <!-- residues -->
  <g fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2">
    <circle cx="65"  cy="100" r="12"/>
    <circle cx="155" cy="100" r="12"/>
    <circle cx="245" cy="100" r="12"/>
    <circle cx="288" cy="139" r="12"/>
    <circle cx="250" cy="178" r="12"/>
    <circle cx="160" cy="178" r="12"/>
    <circle cx="70"  cy="178" r="12"/>
    <circle cx="115" cy="178" r="12"/>
    <circle cx="110" cy="100" r="12"/>
  </g>
  <!-- the labelled contact pair -->
  <circle cx="200" cy="100" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <circle cx="205" cy="178" r="13" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="200" y="105" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#B31B1B">i</text>
  <text x="205" y="183" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#B31B1B">j</text>

  <!-- distance annotation -->
  <text x="222" y="145" font-size="13" fill="#B31B1B">&lt; 10 &#197;</text>

  <!-- chain ends -->
  <text x="46" y="88" font-size="12" fill="#888">N</text>
  <text x="52" y="196" font-size="12" fill="#888">C</text>

  <!-- legend -->
  <circle cx="330" cy="72" r="10" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
  <text x="350" y="70" font-size="15" font-weight="bold" fill="#B31B1B">residue = node</text>
  <text x="350" y="88" font-size="13" fill="#777">one per amino acid</text>

  <line x1="320" y1="138" x2="342" y2="138" stroke="#999" stroke-width="3" stroke-linecap="round"/>
  <text x="350" y="136" font-size="15" font-weight="bold" fill="#B31B1B">backbone</text>
  <text x="350" y="154" font-size="13" fill="#777">next in sequence</text>

  <line x1="320" y1="200" x2="342" y2="200" stroke="#B31B1B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="350" y="198" font-size="15" font-weight="bold" fill="#B31B1B">contact = edge</text>
  <text x="350" y="216" font-size="13" fill="#777">within ~10 &#197; in 3D</text>

  <text x="235" y="262" text-anchor="middle" font-size="14" fill="#666">
    <tspan font-style="italic">i</tspan> and <tspan font-style="italic">j</tspan> are far apart along the chain and adjacent in space.
  </text>
</svg>
