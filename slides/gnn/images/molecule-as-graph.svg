<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 280" font-family="Helvetica, Arial, sans-serif">
  <text x="155" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">acetic acid</text>

  <!-- bonds = edges -->
  <g stroke="#777" stroke-width="2.5" stroke-linecap="round">
    <line x1="85" y1="200" x2="155" y2="158"/>
    <line x1="155" y1="158" x2="225" y2="200"/>
    <line x1="149" y1="158" x2="149" y2="85"/>
    <line x1="161" y1="158" x2="161" y2="85"/>
  </g>

  <!-- atoms = nodes -->
  <circle cx="85"  cy="200" r="20" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2.5"/>
  <circle cx="155" cy="158" r="20" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2.5"/>
  <circle cx="155" cy="75"  r="20" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <circle cx="225" cy="200" r="20" fill="#f5c9c9" stroke="#B31B1B" stroke-width="2.5"/>
  <g font-size="17" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="85"  y="206">C</text>
    <text x="155" y="164">C</text>
    <text x="155" y="81">O</text>
    <text x="225" y="206">O</text>
  </g>

  <!-- legend -->
  <circle cx="285" cy="68" r="11" fill="#cfe0f0" stroke="#4a7fb5" stroke-width="2"/>
  <text x="304" y="66" font-size="15" font-weight="bold" fill="#B31B1B">atom = node</text>
  <text x="304" y="85" font-size="13" fill="#777">element = node feature</text>

  <line x1="274" y1="135" x2="296" y2="135" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
  <text x="304" y="133" font-size="15" font-weight="bold" fill="#B31B1B">bond = edge</text>
  <text x="304" y="152" font-size="13" fill="#777">a pair of bonded atoms</text>

  <g stroke="#777" stroke-width="2.5" stroke-linecap="round">
    <line x1="274" y1="198" x2="296" y2="198"/>
    <line x1="274" y1="206" x2="296" y2="206"/>
  </g>
  <text x="304" y="200" font-size="15" font-weight="bold" fill="#B31B1B">bond order</text>
  <text x="304" y="219" font-size="13" fill="#777">= an edge feature</text>

  <text x="155" y="252" text-anchor="middle" font-size="14" fill="#666">Hydrogens are usually left implicit.</text>
</svg>
