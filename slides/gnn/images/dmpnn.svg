<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d1" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto">
      <path d="M0,0 L6.5,2.8 L0,5.6 z" fill="#a33"/>
    </marker>
    <marker id="d2" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto">
      <path d="M0,0 L6.5,2.8 L0,5.6 z" fill="#2e7d5b"/>
    </marker>
  </defs>

  <!-- ============ TOP : atom-based ============ -->
  <text x="210" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#a33">Atom-based messages</text>
  <rect x="20" y="36" width="380" height="130" rx="8" fill="#fdf4f4" stroke="#e0bcbc"/>

  <line x1="130" y1="100" x2="290" y2="100" stroke="#ccc" stroke-width="2.5"/>
  <circle cx="130" cy="100" r="20" fill="#f5c9c9" stroke="#a33" stroke-width="2.5"/>
  <circle cx="290" cy="100" r="20" fill="#f5c9c9" stroke="#a33" stroke-width="2.5"/>
  <text x="130" y="106" text-anchor="middle" font-size="15" fill="#333">A</text>
  <text x="290" y="106" text-anchor="middle" font-size="15" fill="#333">B</text>

  <!-- forward arrow above -->
  <path d="M148,84 Q210,58 272,84" fill="none" stroke="#a33" stroke-width="2.5" marker-end="url(#d1)"/>
  <text x="210" y="58" text-anchor="middle" font-size="12" fill="#a33">round k</text>
  <!-- backward arrow below -->
  <path d="M272,118 Q210,144 148,118" fill="none" stroke="#a33" stroke-width="2.5" marker-end="url(#d1)"/>
  <text x="210" y="156" text-anchor="middle" font-size="12" fill="#a33">round k+1 — A hears its own message back</text>

  <!-- ============ BOTTOM : bond-based ============ -->
  <text x="210" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d5b">Directed-bond messages (D-MPNN)</text>
  <rect x="20" y="216" width="380" height="130" rx="8" fill="#f2f8f5" stroke="#b3d4c4"/>

  <line x1="90" y1="286" x2="210" y2="286" stroke="#ccc" stroke-width="2.5"/>
  <line x1="210" y1="286" x2="330" y2="286" stroke="#ccc" stroke-width="2.5"/>
  <circle cx="90" cy="286" r="19" fill="#d6ece0" stroke="#2e7d5b" stroke-width="2.5"/>
  <circle cx="210" cy="286" r="19" fill="#d6ece0" stroke="#2e7d5b" stroke-width="2.5"/>
  <circle cx="330" cy="286" r="19" fill="#d6ece0" stroke="#2e7d5b" stroke-width="2.5"/>
  <text x="90" y="292" text-anchor="middle" font-size="15" fill="#333">A</text>
  <text x="210" y="292" text-anchor="middle" font-size="15" fill="#333">B</text>
  <text x="330" y="292" text-anchor="middle" font-size="15" fill="#333">C</text>

  <!-- state lives on directed bond A->B, feeds B->C only -->
  <path d="M110,268 Q150,246 192,268" fill="none" stroke="#2e7d5b" stroke-width="2.5" marker-end="url(#d2)"/>
  <text x="150" y="243" text-anchor="middle" font-size="11.5" fill="#2e7d5b">h(A→B)</text>
  <path d="M230,268 Q270,246 312,268" fill="none" stroke="#2e7d5b" stroke-width="2.5" marker-end="url(#d2)"/>
  <text x="270" y="243" text-anchor="middle" font-size="11.5" fill="#2e7d5b">h(B→C)</text>

  <!-- the excluded reverse -->
  <path d="M192,306 Q150,326 110,306" fill="none" stroke="#bbb" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="140" y1="308" x2="162" y2="326" stroke="#a33" stroke-width="2.5"/>
  <line x1="162" y1="308" x2="140" y2="326" stroke="#a33" stroke-width="2.5"/>
  <text x="270" y="325" text-anchor="middle" font-size="12" fill="#666">reverse bond excluded</text>

  <!-- punchline -->
  <rect x="20" y="356" width="380" height="38" rx="8" fill="#f2f8f5" stroke="#2e7d5b" stroke-width="2"/>
  <text x="210" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d5b">Messages never immediately backtrack.</text>
</svg>
