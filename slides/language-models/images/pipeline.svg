<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- Stage boxes -->
  <g>
    <rect x="14" y="26" width="216" height="132" rx="7" fill="#fdf3f3" stroke="#B31B1B" stroke-width="2.5"/>
    <text x="122" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">1. Pretraining</text>
    <text x="122" y="76" text-anchor="middle" font-size="15" fill="#333">Next-token prediction</text>
    <text x="122" y="95" text-anchor="middle" font-size="15" fill="#333">over a huge corpus</text>
    <text x="122" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Gives: knowledge</text>
    <text x="122" y="143" text-anchor="middle" font-size="14" fill="#666">chemistry, biology, physics</text>
  </g>

  <g>
    <rect x="258" y="26" width="216" height="132" rx="7" fill="#f7f7f9" stroke="#888" stroke-width="2"/>
    <text x="366" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">2. SFT</text>
    <text x="366" y="76" text-anchor="middle" font-size="15" fill="#333">Supervised fine-tuning</text>
    <text x="366" y="95" text-anchor="middle" font-size="15" fill="#333">on written demonstrations</text>
    <text x="366" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Gives: the format</text>
    <text x="366" y="143" text-anchor="middle" font-size="14" fill="#666">answers instead of continues</text>
  </g>

  <g>
    <rect x="502" y="26" width="216" height="132" rx="7" fill="#f7f7f9" stroke="#888" stroke-width="2"/>
    <text x="610" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">3. RLHF / RLAIF</text>
    <text x="610" y="76" text-anchor="middle" font-size="15" fill="#333">RL on human or AI</text>
    <text x="610" y="95" text-anchor="middle" font-size="15" fill="#333">preference judgments</text>
    <text x="610" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Gives: the manners</text>
    <text x="610" y="143" text-anchor="middle" font-size="14" fill="#666">helpful, safe, well-liked</text>
  </g>

  <g>
    <rect x="746" y="26" width="200" height="132" rx="7" fill="#fdf3f3" stroke="#B31B1B" stroke-width="2.5"/>
    <text x="846" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#B31B1B">4. RLVR</text>
    <text x="846" y="76" text-anchor="middle" font-size="15" fill="#333">RL on answers that</text>
    <text x="846" y="95" text-anchor="middle" font-size="15" fill="#333">can be checked</text>
    <text x="846" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Gives: reasoning</text>
    <text x="846" y="143" text-anchor="middle" font-size="14" fill="#666">math, code, derivations</text>
  </g>

  <!-- Arrows -->
  <g fill="#B31B1B">
    <polygon points="234,84 254,92 234,100"/>
    <polygon points="478,84 498,92 478,100"/>
    <polygon points="722,84 742,92 722,100"/>
  </g>

  <!-- Proportional compute bar -->
  <text x="14" y="205" font-size="16" font-weight="bold" fill="#333">Share of total training compute, drawn to scale</text>
  <rect x="14" y="218" width="932" height="34" rx="4" fill="#B31B1B"/>
  <rect x="927" y="218" width="19" height="34" rx="4" fill="#999"/>
  <rect x="927" y="218" width="1.5" height="34" fill="#ffffff"/>
  <text x="470" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Pretraining — roughly 98–99% of all compute spent</text>

  <line x1="936" y1="218" x2="936" y2="278" stroke="#666" stroke-width="1.5"/>
  <line x1="936" y1="278" x2="820" y2="278" stroke="#666" stroke-width="1.5"/>
  <text x="812" y="283" text-anchor="end" font-size="15" fill="#555">all of post-training (stages 2–4) fits in here</text>

  <text x="14" y="313" font-size="14" fill="#777">Proportions are approximate and vary by lab.</text>
</svg>
