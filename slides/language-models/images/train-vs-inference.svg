<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="340" fill="#ffffff"/>

  <!-- LEFT PANEL: training -->
  <rect x="12" y="14" width="452" height="312" rx="8" fill="#fdf3f3" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="238" y="46" text-anchor="middle" font-size="21" font-weight="bold" fill="#B31B1B">Training compute</text>
  <text x="238" y="70" text-anchor="middle" font-size="16" fill="#555">Paid once, before anyone uses it</text>

  <rect x="176" y="92" width="124" height="150" rx="4" fill="#B31B1B"/>
  <text x="238" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">one run</text>

  <text x="238" y="268" text-anchor="middle" font-size="16" fill="#222">Llama 3 405B: 3.8 &#215; 10<tspan font-size="11" dy="-6">25</tspan><tspan dy="6"> FLOPs</tspan></text>
  <text x="238" y="290" text-anchor="middle" font-size="16" fill="#222">16,000 H100 GPUs, ~54 days</text>
  <text x="238" y="312" text-anchor="middle" font-size="16" fill="#222">Frontier runs: tens to hundreds of $M</text>

  <!-- RIGHT PANEL: inference -->
  <rect x="496" y="14" width="452" height="312" rx="8" fill="#f5f7fa" stroke="#3a4a63" stroke-width="2.5"/>
  <text x="722" y="46" text-anchor="middle" font-size="21" font-weight="bold" fill="#3a4a63">Inference compute</text>
  <text x="722" y="70" text-anchor="middle" font-size="16" fill="#555">Paid again on every single query</text>

  <g fill="#3a4a63">
    <rect x="524" y="222" width="16" height="20" rx="2"/>
    <rect x="548" y="216" width="16" height="26" rx="2"/>
    <rect x="572" y="226" width="16" height="16" rx="2"/>
    <rect x="596" y="212" width="16" height="30" rx="2"/>
    <rect x="620" y="224" width="16" height="18" rx="2"/>
    <rect x="644" y="218" width="16" height="24" rx="2"/>
    <rect x="668" y="228" width="16" height="14" rx="2"/>
    <rect x="692" y="214" width="16" height="28" rx="2"/>
    <rect x="716" y="222" width="16" height="20" rx="2"/>
    <rect x="740" y="217" width="16" height="25" rx="2"/>
    <rect x="764" y="227" width="16" height="15" rx="2"/>
    <rect x="788" y="211" width="16" height="31" rx="2"/>
    <rect x="812" y="223" width="16" height="19" rx="2"/>
    <rect x="836" y="219" width="16" height="23" rx="2"/>
    <rect x="860" y="225" width="16" height="17" rx="2"/>
    <rect x="884" y="215" width="16" height="27" rx="2"/>
