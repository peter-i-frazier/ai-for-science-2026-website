  <text x="722" y="196" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a4a63">millions of small runs</text>

  <text x="722" y="268" text-anchor="middle" font-size="16" fill="#222">One 10,000-word paper ~ 15,000 tokens</text>
  <text x="722" y="290" text-anchor="middle" font-size="16" fill="#222">At Opus 5 list price ($5/M input): ~7.5 cents</text>
  <text x="722" y="312" text-anchor="middle" font-size="16" fill="#222">A long agent run: 100s of $ to $1000s</text>

  <line x1="470" y1="40" x2="470" y2="300" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5 5"/>
