<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#B31B1B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3d8b5f"/>
    </marker>
  </defs>

  <rect x="10" y="50" width="120" height="62" rx="8" fill="#f0ece0" stroke="#8a8578" stroke-width="1.5"/>
  <text x="70" y="87" font-size="20" text-anchor="middle" fill="#33404a">Goal</text>

  <rect x="182" y="50" width="186" height="62" rx="8" fill="#fbe3e3" stroke="#B31B1B" stroke-width="2.5"/>
  <text x="275" y="77" font-size="19" text-anchor="middle" fill="#33404a">LLM picks</text>
  <text x="275" y="99" font-size="19" text-anchor="middle" fill="#33404a">the next action</text>

  <rect x="420" y="50" width="160" height="62" rx="8" fill="#f0ece0" stroke="#8a8578" stroke-width="1.5"/>
  <text x="500" y="77" font-size="19" text-anchor="middle" fill="#33404a">Tool runs</text>
  <text x="500" y="99" font-size="16" text-anchor="middle" fill="#6b7280">code · search · robot</text>

  <rect x="632" y="50" width="160" height="62" rx="8" fill="#f0ece0" stroke="#8a8578" stroke-width="1.5"/>
  <text x="712" y="87" font-size="19" text-anchor="middle" fill="#33404a">Observation</text>

  <rect x="838" y="50" width="56" height="62" rx="8" fill="#e4efe6" stroke="#3d8b5f" stroke-width="1.5"/>
  <text x="866" y="87" font-size="18" text-anchor="middle" fill="#33404a">Done</text>

  <line x1="132" y1="81" x2="176" y2="81" stroke="#B31B1B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="370" y1="81" x2="414" y2="81" stroke="#B31B1B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="582" y1="81" x2="626" y2="81" stroke="#B31B1B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="794" y1="81" x2="832" y2="81" stroke="#3d8b5f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <path d="M712,116 L712,156 L275,156 L275,118" fill="none" stroke="#B31B1B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="494" y="180" font-size="18" text-anchor="middle" fill="#B31B1B">repeat until the goal is met, or the budget runs out</text>
</svg>
