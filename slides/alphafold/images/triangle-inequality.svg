<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 342" width="1100" height="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- AlphaFold 2, idea 2: two sides of a triangle bound the third. Real distances from PDB 1A6M (figures/myoglobin_distances.py). Drawn for ORIE 7190 by figures/make_triangle_figs.py. -->
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#B31B1B"/></marker>
<marker id="ap" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#6a3d9a"/></marker>
<marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#666666"/></marker>
<marker id="ak" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#222222"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c8c8c8" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="100%" height="100%" fill="white"/>
<circle cx="230.0" cy="175.0" r="124.1" fill="none" stroke="#a0a0a0" stroke-width="1.8" stroke-dasharray="6 5"/>
<line x1="105.9" y1="175.0" x2="354.1" y2="175.0" stroke="#a0a0a0" stroke-width="1.8" stroke-dasharray="6 5"/>
<circle cx="354.1" cy="175.0" r="15" fill="white" stroke="#666666" stroke-width="1.8" stroke-dasharray="4 3"/>
<circle cx="105.9" cy="175.0" r="15" fill="white" stroke="#666666" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="376.1" y="172.0" font-size="18" text-anchor="start" font-weight="normal" fill="#666666">12.3 Å</text>
<text x="376.1" y="194.0" font-size="18" text-anchor="start" font-weight="normal" fill="#666666">from G80</text>
<text x="83.9" y="172.0" font-size="18" text-anchor="end" font-weight="normal" fill="#666666">2.3 Å</text>
<text x="83.9" y="194.0" font-size="18" text-anchor="end" font-weight="normal" fill="#666666">from G80</text>
<text x="230.0" y="22.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">Each side is one cell of the pair table</text>
<text x="230.0" y="263.1" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">points 7.3 Å</text>
<text x="230.0" y="285.1" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">from H82</text>
<line x1="145.0" y1="175.0" x2="230.0" y2="175.0" stroke="#222222" stroke-width="3.5"/>
<line x1="230.0" y1="175.0" x2="314.0" y2="83.6" stroke="#222222" stroke-width="3.5"/>
<line x1="145.0" y1="175.0" x2="314.0" y2="83.6" stroke="#B31B1B" stroke-width="3.5"/>
<text x="187.5" y="205.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">5.0 Å</text>
<text x="312.0" y="141.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">7.3 Å</text>
<text x="203.5" y="117.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#B31B1B" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">11.3 Å</text>
<circle cx="145.0" cy="175.0" r="24" fill="white" stroke="#222222" stroke-width="2.5"/>
<text x="145.0" y="181.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">G80</text>
<circle cx="230.0" cy="175.0" r="24" fill="white" stroke="#222222" stroke-width="2.5"/>
<text x="230.0" y="181.5" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">H82</text>
<circle cx="314.0" cy="83.6" r="24" fill="white" stroke="#222222" stroke-width="2.5"/>
<text x="314.0" y="90.1" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">A84</text>
<text x="520.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#222222">Two short sides: G80–H82 5.0 Å, H82–A84 7.3 Å</text>
<text x="520.0" y="58.0" font-size="18" text-anchor="start" font-weight="normal" fill="#222222">so 7.3 − 5.0 ≤ G80–A84 ≤ 5.0 + 7.3</text>
<rect x="520.0" y="99.0" width="506.0" height="26.0" rx="0" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="572.9" y="99.0" width="230.0" height="26.0" rx="0" fill="#c9f0a9" stroke="#5a9e2a" stroke-width="1.5"/>
<line x1="520.0" y1="125.0" x2="1039.8" y2="125.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="687.9" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#2f5e12">possible</text>
<text x="914.5" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">impossible</text>
<line x1="779.9" y1="91.0" x2="779.9" y2="129.0" stroke="#B31B1B" stroke-width="3"/>
<text x="779.9" y="86.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#B31B1B">true 11.3 Å</text>
<line x1="572.9" y1="125.0" x2="572.9" y2="131.0" stroke="#222222" stroke-width="1.5"/>
<text x="572.9" y="150.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">2.3</text>
<line x1="802.9" y1="125.0" x2="802.9" y2="131.0" stroke="#222222" stroke-width="1.5"/>
<text x="802.9" y="150.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">12.3</text>
<text x="520.0" y="150.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">0</text>
<text x="1045.8" y="131.0" font-size="18" text-anchor="start" font-weight="normal" fill="#666666">Å</text>
<text x="520.0" y="184.0" font-size="18" text-anchor="start" font-weight="bold" fill="#222222">Two long sides: G80–A84 11.3 Å, H81–A84 8.7 Å</text>
<text x="520.0" y="208.0" font-size="18" text-anchor="start" font-weight="normal" fill="#222222">so 11.3 − 8.7 ≤ G80–H81 ≤ 11.3 + 8.7</text>
<rect x="520.0" y="249.0" width="506.0" height="26.0" rx="0" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="579.8" y="249.0" width="400.2" height="26.0" rx="0" fill="#c9f0a9" stroke="#5a9e2a" stroke-width="1.5"/>
<line x1="520.0" y1="275.0" x2="1039.8" y2="275.0" stroke="#222222" stroke-width="1.5" marker-end="url(#ak)"/>
<text x="749.9" y="268.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#2f5e12">possible</text>
<line x1="630.4" y1="241.0" x2="630.4" y2="279.0" stroke="#B31B1B" stroke-width="3"/>
<text x="630.4" y="236.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#B31B1B">true 4.8 Å</text>
<line x1="579.8" y1="275.0" x2="579.8" y2="281.0" stroke="#222222" stroke-width="1.5"/>
<text x="579.8" y="300.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">2.6</text>
<line x1="980.0" y1="275.0" x2="980.0" y2="281.0" stroke="#222222" stroke-width="1.5"/>
<text x="980.0" y="300.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#222222">20.0</text>
<text x="520.0" y="300.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">0</text>
<text x="1045.8" y="281.0" font-size="18" text-anchor="start" font-weight="normal" fill="#666666">Å</text>
<text x="550.0" y="334.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#666666">Cβ distances (Cα for Gly80) in sperm whale myoglobin, PDB 1A6M. The triangle is drawn to scale.</text>
</svg>
