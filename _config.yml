title: AI for Science (ORIE 7190)
description: Cornell ORIE, Fall 2026. A paper-reading seminar on modern AI for science.
theme: jekyll-theme-cayman
url: https://peter-i-frazier.github.io
baseurl: /ai-for-science-2026-website

# Cayman renders the stylesheet href as "style.css?v={{ site.github.build_revision }}".
# Locally that is empty, so the URL never changes and browsers serve a stale cached copy.
# Bump this string whenever a CSS change needs to reach an already-loaded browser.
github:
  build_revision: css-5
  # Suppresses Cayman's "View on GitHub" banner button.
  is_project_page: false

show_downloads: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .obsidian
  - README.md
