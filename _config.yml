title: AI for Science (ORIE 7190)
description: A graduate course bridging AI methods and the sciences.
theme: jekyll-theme-cayman

# GitHub Pages enables jekyll-titles-from-headings by default. It sets page.title
# from a page's first heading, and Cayman's banner renders page.title in preference
# to site.title -- so index.md's first "##" was replacing "AI for Science (ORIE 7190)"
# in the banner on the published site but not locally. Turn it off so both match.
titles_from_headings:
  enabled: false
url: https://peter-i-frazier.github.io
baseurl: /ai-for-science-2026-website

# Cayman renders the stylesheet href as "style.css?v={{ site.github.build_revision }}".
# Locally that is empty, so the URL never changes and browsers serve a stale cached copy.
# Bump this string whenever a CSS change needs to reach an already-loaded browser.
github:
  build_revision: css-5
  # Suppresses Cayman's "View on GitHub" banner button.
  is_project_page: false

show_downloads: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .obsidian
  - README.md
